# XcodeGen spec for the iPhone client of cua-bots-service.
#
#   xcodegen generate
#   xcodebuild -scheme CuaBotsPhone -destination 'platform=iOS Simulator,name=iPhone 17' build
#
# For a device, pass your team:
#   xcodebuild -scheme CuaBotsPhone -destination 'id=<UDID>' \
#     DEVELOPMENT_TEAM=<TEAM_ID> -allowProvisioningUpdates build
name: CuaBotsPhone
options:
  bundleIdPrefix: dev.dokodemo
  deploymentTarget:
    iOS: "18.0"
packages:
  CuaBotsService:
    path: .
targets:
  CuaBotsPhone:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: CuaBotsService
        product: CuaBotsServiceUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dokodemo.cuabots
        PRODUCT_NAME: CuaBotsPhone
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Cua Bots
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The service is a private HTTP address inside the VPN. ATS cannot
        # exempt an IP literal, so the app allows cleartext; keep it VPN-only.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: VPN 内の Cua Bots サービスへ接続します。
        CFBundleURLTypes:
          - CFBundleURLName: dev.dokodemo.cuabots
            CFBundleURLSchemes:
              - cuabots-service
